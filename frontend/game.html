<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skribbl</title>
    <link rel="stylesheet" href="style/game.css">
</head>
<body> 
    <div class="outer-container">
        <div class="navbar">0</div>
        <div class="container">
            <div class="player-section">1
                <!-- <div class="player">
                    <div class="player-name">Pranav </div>
                    <div class="player-score">210</div>
                </div> -->
            </div>
            
            <div class="drawing-section">
                <!-- drawing section contains timer and word to be guesses drawing area color palaette and tools -->
                <div class="drawing-section-top">2.1</div>
                <div class="drawing-canvas">
                    <canvas class="canvas" width="1200" height="900"></canvas>
                </div>
                <div class="drawing-palette">
                    <div class="colors">
                        <div class="color" style="background-color: red;"></div>
                        <div class="color" style="background-color: blue;"></div>
                        <div class="color" style="background-color: yellow;"></div>
                        <div class="color" style="background-color: green;"></div>
                        <div class="color" style="background-color: darkgreen;"></div>
                        <div class="color" style="background-color: orange;"></div>
                        <div class="color" style="background-color: pink;"></div>
                        <div class="color" style="background-color: purple;"></div>
                        <div class="color" style="background-color: black;"></div>
                        <div class="color" style="background-color: white;"></div>
                        <div class="color" style="background-color: gray;"></div>
                        <div class="color" style="background-color: violet;"></div>
                    </div>
                </div>
            </div>
            
            <!-- <canvas class="drawing-section"></canvas> -->
            <div class="chat-section">
                <div class="chatbox">
                    <!-- <div class="message-self">
                       <span class="message-username">User: </span>
                       <span class="message-text">Hey!!</span>
                    </div>-->

                </div>
                <div class="chat-input-container">
                    <input type="text" class="chat-input" placeholder="Type your guess...">
                    <button class="send">Send</button>
                </div>
            </div>
        </div> 
    </div>
</body>
<script src="script/game.js"></script>
</html>
